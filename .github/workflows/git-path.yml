name: Git path portability

on: [push, pull_request]

permissions:
  contents: read

jobs:
  git-path:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - shell: bash
        run: |
          rustc +1.95.0 --edition=2021 --test mirror-agent/src/git_path.rs -o "$RUNNER_TEMP/git-path-tests.exe"
          "$RUNNER_TEMP/git-path-tests.exe"
