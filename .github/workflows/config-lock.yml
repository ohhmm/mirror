name: Configuration lock portability

on: [push, pull_request]

permissions:
  contents: read

jobs:
  config-lock:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
      - run: uv run --no-project --python 3.12 --with pytest --with pytest-asyncio --with freezegun python -m pytest mirror-cli/tests/config_test.py mirror-cli/tests/file_lock_test.py -q -o faulthandler_timeout=30 -o faulthandler_exit_on_timeout=true
        env:
          PYTHONPATH: mirror-cli/src
